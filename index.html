<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken RPG: Elite System</title>
    <script async data-goatcounter="https://mamonjyzir.goatcounter.com/count" src="//gc.zgo.at/count.js"></script>
    
    <style>
        :root { --gold: #fbbf24; --bg: #020617; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Arial Black', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; background: var(--bg); z-index: 10; }
        .hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }
        .menu-card { text-align: center; padding: 25px; background: var(--card); border-radius: 30px; border: 4px solid var(--gold); width: 350px; box-shadow: 0 0 50px rgba(251, 191, 36, 0.2); max-height: 90vh; overflow-y: auto; }
        input { width: 85%; padding: 10px; margin: 6px 0; border-radius: 10px; border: none; text-align: center; font-weight: bold; background: #0f172a; color: white; border: 1px solid #334155; font-size: 13px; }
        label { font-size: 10px; color: #94a3b8; display: block; text-align: left; margin-left: 25px; margin-top: 5px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); margin-top: 5px; }
        .header { width: 100%; max-width: 450px; background: var(--card); padding: 15px; display: flex; justify-content: space-around; border-bottom: 4px solid var(--gold); }
        .val { font-size: 22px; color: var(--gold); display: block; }
        #enemy-sprite { font-size: 130px; cursor: pointer; user-select: none; transition: 0.1s; margin: 20px; }
        #enemy-sprite:active { transform: scale(0.8); }
        table { width: 100%; border-spacing: 0 5px; }
        td { padding: 10px; background: rgba(15, 23, 42, 0.5); font-size: 14px; }
        .me { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <div class="menu-card">
            <h1 style="color:var(--gold); margin-bottom:20px;">CHICKEN RPG</h1>
            <button class="btn btn-gold" onclick="showAuth('login')">LOG IN</button>
            <button class="btn btn-outline" onclick="showAuth('signup')">CREATE ACCOUNT</button>
        </div>
    </div>

    <div id="auth-screen" class="screen hidden">
        <div class="menu-card">
            <h2 id="auth-title" style="color:var(--gold); margin-top:0;">LOGIN</h2>
            
            <div id="form-fields">
                <label>NICKNAME</label>
                <input type="text" id="field-nick" placeholder="Username">
                
                <div id="extra-fields" class="hidden">
                    <label>EMAIL</label>
                    <input type="email" id="field-email" placeholder="example@mail.com">
                    <label>BIRTH DATE</label>
                    <input type="date" id="field-birth">
                </div>

                <label>PASSWORD</label>
                <input type="password" id="field-pass" placeholder="Enter MDP">
            </div>

            <button id="auth-submit" class="btn btn-gold" onclick="processAuth()">CONFIRM ⚔️</button>
            <button class="btn btn-outline" style="font-size:10px; padding:8px;" onclick="backToStart()">BACK</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="header">
            <div class="stat-box"><small>HERO</small><b class="val" id="disp-nick">---</b></div>
            <div class="stat-box"><small>GOLD</small><b class="val">$<span id="gold">0</span></b></div>
            <div class="stat-box"><small>CLICKS</small><b class="val" id="clicks">0/50</b></div>
        </div>
        <button onclick="location.reload()" style="position:absolute; top:80px; left:20px; background:#ef4444; border:none; color:white; padding: 5px 12px; cursor:pointer; font-weight:bold; border-radius:10px; font-size:10px;">LOGOUT</button>
        <button onclick="toggleRank()" style="position:absolute; top:80px; right:20px; background:var(--gold); border:none; color:black; border-radius:50%; width:40px; height:40px; cursor:pointer; font-weight:bold;">🏆</button>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <h2 id="stage-name" style="color:#94a3b8; letter-spacing:2px; margin:0;">NORMAL EGG</h2>
            <div id="enemy-sprite" onclick="handleAttack()">🥚</div>
            <p id="bonus-info" style="color:#10b981; font-size:12px;">$1 per 50 clicks</p>
        </div>
        <div style="width:100%; max-width:450px; background:var(--card); padding:20px; border-radius:25px 25px 0 0;">
            <button class="btn btn-gold" id="evolve-btn" onclick="buyEvolution()">EVOLVE (<span id="price-tag">$5</span>)</button>
        </div>
    </div>

    <div id="rank-screen" class="screen hidden" style="background:rgba(2, 6, 23, 0.98);">
        <div class="menu-card" style="width: 360px;">
            <h2 style="color:var(--gold)">LEADERBOARD</h2>
            <table><tbody id="ranking-list"></tbody></table>
            <button class="btn btn-gold" onclick="toggleRank()">CLOSE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBF9FSfg-hTxPQgfsE_-qX52QU-QFs682c",
            authDomain: "chickenevolutionzir.firebaseapp.com",
            projectId: "chickenevolutionzir",
            storageBucket: "chickenevolutionzir.firebasestorage.app",
            messagingSenderId: "576435489622",
            appId: "1:576435489622:web:b501c88918917e9eb824f7",
            measurementId: "G-HG9KCW6KWW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let data = { nick: "", email: "", birth: "", pass: "", money: 0, stage: 0, clickCount: 0 };
        let authMode = "login";
        const config = [
            { name: "NORMAL EGG", icon: "🥚", price: 5, income: 1 },
            { name: "GREEN CHICK", icon: "🐣", price: 10, income: 3 },
            { name: "BRONZE CHICKEN", icon: "🐥", price: 20, income: 10 },
            { name: "GOLDEN KING", icon: "🐓", price: 0, income: 50 }
        ];

        window.showAuth = (mode) => {
            authMode = mode;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('auth-title').innerText = mode === 'login' ? "LOGIN" : "CREATE ACCOUNT";
            document.getElementById('extra-fields').classList.toggle('hidden', mode === 'login');
        };

        window.backToStart = () => {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        };

        window.processAuth = async function() {
            const nick = document.getElementById('field-nick').value.trim();
            const pass = document.getElementById('field-pass').value.trim();
            if(!nick || !pass) return alert("Fill all fields!");

            const docRef = doc(db, "players", nick);
            const docSnap = await getDoc(docRef);

            if(authMode === "signup") {
                if(docSnap.exists()) return alert("Username already taken!");
                const email = document.getElementById('field-email').value;
                const birth = document.getElementById('field-birth').value;
                if(!email || !birth) return alert("Please fill Email and Birth Date!");
                data = { nick, pass, email, birth, money: 0, stage: 0, clickCount: 0 };
                enterGame();
            } else {
                if(!docSnap.exists()) return alert("User not found!");
                const dbData = docSnap.data();
                if(dbData.pass !== pass) return alert("Wrong password!");
                data = dbData;
                enterGame();
            }
        };

        function enterGame() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('disp-nick').innerText = data.nick.toUpperCase();
            syncToFirebase();
            startLeaderboardListener();
            render();
        }

        window.handleAttack = () => {
            data.clickCount++;
            if(data.clickCount >= 50) {
                data.money += config[data.stage].income;
                data.clickCount = 0;
                syncToFirebase();
            }
            render();
        };

        window.buyEvolution = () => {
            const cur = config[data.stage];
            if(data.money >= cur.price && data.stage < 3) {
                data.money -= cur.price;
                data.stage++;
                syncToFirebase();
                render();
            }
        };

        async function syncToFirebase() {
            if(data.nick) await setDoc(doc(db, "players", data.nick), data);
        }

        function startLeaderboardListener() {
            const q = query(collection(db, "players"), orderBy("money", "desc"), limit(10));
            onSnapshot(q, (snap) => {
                let html = ""; let i = 1;
                snap.forEach(d => {
                    const p = d.data();
                    html += `<tr class="${p.nick===data.nick?'me':''}"><td>${i++}</td><td style="text-align:left">${p.nick.toUpperCase()}</td><td>$${p.money}</td></tr>`;
                });
                document.getElementById('ranking-list').innerHTML = html;
            });
        }

        window.toggleRank = () => document.getElementById('rank-screen').classList.toggle('hidden');

        function render() {
            document.getElementById('gold').innerText = data.money;
            document.getElementById('clicks').innerText = data.clickCount + "/50";
            const cur = config[data.stage];
            document.getElementById('enemy-sprite').innerText = cur.icon;
            document.getElementById('stage-name').innerText = cur.name;
            document.getElementById('price-tag').innerText = data.stage < 3 ? "$" + cur.price : "MAX";
            document.getElementById('evolve-btn').disabled = data.stage >= 3 || data.money < cur.price;
            document.getElementById('bonus-info').innerText = `$${cur.income} per 50 clicks`;
        }
    </script>
<script data-goatcounter="https://mamonjyzir.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
