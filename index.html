<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Evolution: Ultra - Mamonjy Zir</title>
    <script data-goatcounter="https://mamonjyzir.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        body { 
            background: #020617; 
            color: white; font-family: 'Impact', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; transition: background 0.1s;
        }
        .game-card { 
            background: #1e293b; padding: 40px; border-radius: 50px; 
            box-shadow: 0 0 60px rgba(0,0,0,1); text-align: center; width: 350px; 
            border: 2px solid #334155;
        }
        .score-box { font-size: 40px; color: #fbbf24; margin-bottom: 10px; text-shadow: 0 0 20px #fbbf24; }
        .stage-text { height: 70px; font-size: 20px; color: #94a3b8; text-transform: uppercase; }
        .chicken-display { font-size: 130px; margin: 30px 0; cursor: pointer; user-select: none; }
        
        .btn-click { 
            background: #e11d48; color: white; border: none; padding: 25px 70px; 
            border-radius: 20px; font-size: 28px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px #881337; width: 100%;
        }
        .btn-click:active { box-shadow: 0 0px #881337; transform: translateY(10px); }

        /* Animation fipoahana */
        .ultra-shake { animation: bigShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes bigShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .flash-white { background-color: white !important; }
    </style>
</head>
<body>

<div class="game-card" id="card">
    <div class="score-box"><span id="score">0</span> CLICKS</div>
    <div id="stage" class="stage-text">CRACK THE EGG!</div>
    <div id="chicken" class="chicken-display" onclick="handleClick()">🥚</div>
    <button class="btn-click" onclick="handleClick()">HIT IT! 🔥</button>
</div>

<script>
    let score = 0;
    let currentStage = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Feo fipoahana (Bass + Noise)
    function playExplosion() {
        // 1. Feo Bass lalina
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);

        // 2. Feo Noise (Fipoahana fotsy)
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
        const noise = audioCtx.createBufferSource();
        const noiseGain = audioCtx.createGain();
        noise.buffer = buffer;
        noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noise.start();
    }

    function handleClick() {
        score++;
        document.getElementById('score').innerText = score;
        
        // Feo kely isaky ny kitika
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.frequency.setValueAtTime(600, audioCtx.currentTime);
        clickGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        clickOsc.connect(clickGain); clickGain.connect(audioCtx.destination);
        clickOsc.start(); clickOsc.stop(audioCtx.currentTime + 0.05);

        updateEvolution();
    }

    function updateEvolution() {
        let newStage = 0; let text = ""; let emoji = "";
        const card = document.getElementById('card');
        const body = document.body;

        if (score < 40) { emoji = "🥚"; text = "CRACKING..."; newStage = 0; }
        else if (score < 100) { emoji = "🐣"; text = "BOOM! UNLEASHED! 🎉"; newStage = 1; }
        else if (score < 250) { emoji = "🐥"; text = "EVOLUTION COMPLETE! ⚡"; newStage = 2; }
        else if (score < 600) { emoji = "🐓"; text = "MEGA ROOSTER! 💪"; newStage = 3; }
        else if (score < 1000) { emoji = "🐓❤️🐓"; text = "FAMILY POWER! 🔥"; newStage = 4; }
        else { emoji = "👑🐓🔥"; text = "CHICKEN GOD! 👑"; newStage = 5; }

        if (newStage !== currentStage) {
            currentStage = newStage;
            document.getElementById('chicken').innerText = emoji;
            document.getElementById('stage').innerHTML = text;
            
            // Visual & Sound Impact
            playExplosion();
            card.classList.remove('ultra-shake');
            body.classList.add('flash-white');
            void card.offsetWidth; 
            card.classList.add('ultra-shake');
            setTimeout(() => body.classList.remove('flash-white'), 100);
        }
    }
</script>
<script data-goatcounter="https://mamonjyzir.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
