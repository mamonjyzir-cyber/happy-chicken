<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Evolution: Ultra - Mamonjy Zir</title>
    <script data-goatcounter="https://mamonjyzir.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        body { 
            background: #020617; 
            color: white; font-family: 'Impact', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; transition: background 0.1s;
        }

        /* START SCREEN */
        #launch-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e293b, #020617);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s ease;
        }
        .launch-btn {
            background: #fbbf24; color: #020617; border: none; padding: 20px 50px;
            font-size: 30px; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.5); transition: transform 0.2s;
        }
        .launch-btn:hover { transform: scale(1.1); }

        /* GAME CARD */
        .game-card { 
            background: #1e293b; padding: 40px; border-radius: 50px; 
            box-shadow: 0 0 60px rgba(0,0,0,1); text-align: center; width: 350px; 
            border: 2px solid #334155; display: none; /* Afenina aloha */
        }
        
        .score-box { font-size: 40px; color: #fbbf24; margin-bottom: 5px; text-shadow: 0 0 20px #fbbf24; }
        .wallet-box { font-size: 24px; color: #10b981; margin-bottom: 10px; text-shadow: 0 0 10px #10b981; }
        .stage-text { height: 70px; font-size: 20px; color: #94a3b8; text-transform: uppercase; }
        .chicken-display { font-size: 130px; margin: 20px 0; cursor: pointer; user-select: none; }
        
        .btn-click { 
            background: #e11d48; color: white; border: none; padding: 25px 70px; 
            border-radius: 20px; font-size: 28px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px #881337; width: 100%;
        }
        .btn-click:active { box-shadow: 0 0px #881337; transform: translateY(10px); }

        .ultra-shake { animation: bigShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes bigShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .flash-white { background-color: white !important; }

        .pro-text {
            margin-top: 25px; font-size: 26px; color: #10b981;
            text-shadow: 0 0 15px #10b981; height: 35px; opacity: 0; text-transform: uppercase;
        }
        .pop-anim { animation: popText 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popText {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="launch-screen">
    <h1 style="color: #fbbf24; font-size: 50px; margin-bottom: 30px; text-shadow: 0 0 20px #fbbf24;">CHICKEN ULTRA</h1>
    <button class="launch-btn" onclick="startGame()">LANCEZ LE JEU 🔥</button>
</div>

<div class="game-card" id="card">
    <div class="score-box"><span id="score">0</span> CLICKS</div>
    <div class="wallet-box">$ <span id="money">0</span></div>
    
    <div id="stage" class="stage-text">CRACK THE EGG!</div>
    <div id="chicken" class="chicken-display" onclick="handleClick()">🥚</div>
    <button class="btn-click" onclick="handleClick()">HIT IT! 🔥</button>
    
    <div id="pro-text" class="pro-text"></div>
</div>

<script>
    let score = 0;
    let money = 0;
    let currentStage = 0;
    let audioCtx;

    // Function manomboka ny lalao
    function startGame() {
        // Velomina ny Audio Context (mila action an'ny user vao mandeha ny feo amin'ny navigateur)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Afenina ny Launch Screen ary mipoitra ny lalao
        const screen = document.getElementById('launch-screen');
        const card = document.getElementById('card');
        
        screen.style.opacity = '0';
        setTimeout(() => {
            screen.style.display = 'none';
            card.style.display = 'block';
        }, 500);
    }

    function playExplosion() {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);

        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
        const noise = audioCtx.createBufferSource();
        const noiseGain = audioCtx.createGain();
        noise.buffer = buffer;
        noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noise.start();
    }

    function handleClick() {
        score++;
        document.getElementById('score').innerText = score;
        
        if (score % 10 === 0) {
            money++;
            document.getElementById('money').innerText = money;
        }

        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.frequency.setValueAtTime(600, audioCtx.currentTime);
        clickGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        clickOsc.connect(clickGain); clickGain.connect(audioCtx.destination);
        clickOsc.start(); clickOsc.stop(audioCtx.currentTime + 0.05);

        if (score === 10) showProText("Thank you");
        else if (score === 20) showProText("Thank you play");
        else if (score === 30) showProText("Thank you play like");
        else if (score >= 40 && score % 10 === 0) showProText("Thank you play like pro! 🏆");

        updateEvolution();
    }

    function showProText(text) {
        const proDiv = document.getElementById('pro-text');
        proDiv.innerText = text;
        proDiv.classList.remove('pop-anim');
        void proDiv.offsetWidth; 
        proDiv.classList.add('pop-anim');
    }

    function updateEvolution() {
        let newStage = 0; let text = ""; let emoji = "";
        const card = document.getElementById('card');
        const body = document.body;

        if (score < 40) { emoji = "🥚"; text = "CRACKING..."; newStage = 0; }
        else if (score < 100) { emoji = "🐣"; text = "BOOM! UNLEASHED! 🎉"; newStage = 1; }
        else if (score < 250) { emoji = "🐥"; text = "EVOLUTION COMPLETE! ⚡"; newStage = 2; }
        else if (score < 600) { emoji = "🐓"; text = "MEGA ROOSTER! 💪"; newStage = 3; }
        else if (score < 1000) { emoji = "🐓❤️🐓"; text = "FAMILY POWER! 🔥"; newStage = 4; }
        else { emoji = "👑🐓🔥"; text = "CHICKEN GOD! 👑"; newStage = 5; }

        if (newStage !== currentStage) {
            currentStage = newStage;
            document.getElementById('chicken').innerText = emoji;
            document.getElementById('stage').innerHTML = text;
            
            playExplosion();
            card.classList.remove('ultra-shake');
            body.classList.add('flash-white');
            void card.offsetWidth; 
            card.classList.add('ultra-shake');
            setTimeout(() => body.classList.remove('flash-white'), 100);
        }
    }
</script>
<script data-goatcounter="https://mamonjyzir.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
